name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as file:
              version = tomllib.load(file)["project"]["version"]
          expected_tag = f"v{version}"
          assert os.environ["RELEASE_TAG"] == expected_tag, (
              f"release tag {os.environ['RELEASE_TAG']!r} must match {expected_tag!r}"
          )
          PY
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build wheel and source distribution
        run: python -m build --outdir dist
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Inspect distribution contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from tarfile import open as open_tar
          from zipfile import ZipFile

          banned = ("/.github/", "/.venv/", "/dist/", "/tests/")
          for archive in Path("dist").glob("*"):
              if archive.suffix == ".whl":
                  with ZipFile(archive) as package:
                      names = package.namelist()
              else:
                  with open_tar(archive) as package:
                      names = package.getnames()
              assert all(not name.startswith("/") and ".." not in Path(name).parts for name in names)
              assert not any(part in name for part in banned for name in names), names
          PY
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/headerhound/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
