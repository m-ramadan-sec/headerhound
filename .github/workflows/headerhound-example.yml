name: HeaderHound (example)

# Copy or adapt this workflow only for endpoints you own or are authorized to assess.
# It runs manually and requires an explicit repository variable; it never chooses a target itself.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit authorized HTTPS target
    runs-on: ubuntu-latest
    env:
      HEADERHOUND_TARGET: ${{ vars.HEADERHOUND_TARGET }}
      HEADERHOUND_MIN_SCORE: ${{ vars.HEADERHOUND_MIN_SCORE || '80' }}
    steps:
      - name: Validate configured target
        run: |
          if [[ -z "$HEADERHOUND_TARGET" ]]; then
            echo "Set the repository variable HEADERHOUND_TARGET to an authorized HTTPS URL." >&2
            exit 2
          fi
          if [[ "$HEADERHOUND_TARGET" != https://* ]]; then
            echo "HEADERHOUND_TARGET must be an HTTPS URL." >&2
            exit 2
          fi
      - name: Install HeaderHound from PyPI
        run: python -m pip install --upgrade headerhound
      - name: Scan target and write JSON report
        id: scan
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          headerhound "$HEADERHOUND_TARGET" --json \
            --min-score "$HEADERHOUND_MIN_SCORE" \
            --fail-on high | tee headerhound-report.json
      - name: Upload scan report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: headerhound-report
          path: headerhound-report.json
          if-no-files-found: ignore
      - name: Enforce configured policy
        if: ${{ steps.scan.outcome == 'failure' }}
        run: |
          echo "HeaderHound found a score or severity policy violation." >&2
          exit 1
