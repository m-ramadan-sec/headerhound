name: Bug report
description: Report reproducible scanner behavior that differs from expectations.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, private target URLs, or vulnerability details that should remain confidential. See SECURITY.md for security reports."
  - type: input
    id: version
    attributes:
      label: HeaderHound version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and sanitized output
      description: Remove secrets and sensitive hostnames.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
