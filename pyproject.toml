[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "headerhound"
version = "0.1.0"
description = "A safe, explainable CLI for auditing HTTP security response headers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HeaderHound contributors" }]
keywords = ["security", "http", "headers", "scanner", "csp", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8"]

[project.scripts]
headerhound = "headerhound.cli:main"

[project.urls]
Homepage = "https://github.com/m-ramadan-sec/headerhound"
Repository = "https://github.com/m-ramadan-sec/headerhound"
Issues = "https://github.com/m-ramadan-sec/headerhound/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/headerhound"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=headerhound --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
